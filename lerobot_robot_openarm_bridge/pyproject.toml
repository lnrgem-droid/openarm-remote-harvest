[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_openarm_bridge"
version = "0.1.0"
description = "ROS2 robot_bridge adapter for LeRobot OpenArm collection and control"
requires-python = ">=3.12"
dependencies = ["lerobot", "websockets"]

[tool.setuptools.packages.find]
where = ["."]
