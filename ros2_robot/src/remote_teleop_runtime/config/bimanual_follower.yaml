/**:
  ros__parameters:
    # Jetson: right follower can1, left follower can2.
    enable_right: true
    enable_left: true
    right_arm_can: can1
    left_arm_can: can2
    control_rate: 500.0
    # Startup home is invoked only by the explicit launch argument.  A 0.06 rad
    # completion tolerance matches measured gravity-compensated settling error.
    startup_home_tolerance_rad: 0.06
    startup_home_timeout_s: 15.0
    grav_scale: 0.95
    kp: [30.0, 30.0, 15.0, 15.0, 5.0, 5.0, 5.0]
    kd: [2.2, 2.2, 1.4, 1.4, 0.4, 0.4, 0.4]
    # Match the upstream follower gripper stiffness so both jaws can close
    # firmly against the printed fingers.
    gripper_kp: 10.0
    gripper_kd: 0.1
    gripper_max_rad: -1.0472
    # Same verified staged-test limits as the right-arm configuration.
    # Faster but bounded limits for the wired 250 Hz teleoperation path.
    max_joint_vel: [0.80, 0.80, 0.80, 0.80, 1.00, 1.00, 1.20]
    command_interp_s: 0.005
    publish_joint_states: true
    joint_states_rate: 250.0
    right_command_topic: /follower/right_arm/joint_command
    left_command_topic: /follower/left_arm/joint_command
    joint_states_topic: /follower/joint_states
    disable_service: /follower/openarm_gravity_pd/disable
    pause_service: /follower/openarm_gravity_pd/pause_command_refresh
